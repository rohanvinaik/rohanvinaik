<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <!--
    LAYOUT: One thesis branching to four domains

    Thesis box:   x=240, y=38, w=240, h=40, cx=360
    Spine:        (360,78) -> (360,106)
    Horizontal:   (120,106) -> (600,106)

    Project boxes (y=128, h=55, w=130):
      ModelAtlas:  x=55,  cx=120  (blue)
      Wayfinder:   x=215, cx=280  (orange)
      LintGate:    x=375, cx=440  (green)
      Wesker:      x=535, cx=600  (purple)
  -->

  <defs>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#58a6ff" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#f0883e" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#3fb950" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#a371f7" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="240" fill="#0d1117"/>

  <!-- === THESIS === -->
  <text x="360" y="22" text-anchor="middle" dominant-baseline="middle" fill="#8b949e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" letter-spacing="0.1em">ONE THESIS</text>

  <rect x="240" y="38" width="240" height="40" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="360" y="58" text-anchor="middle" dominant-baseline="middle" fill="#e6edf3" font-size="14" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-weight="600">Structure &gt; Scale</text>

  <!-- === CONNECTORS === -->
  <line x1="360" y1="78" x2="360" y2="106" stroke="#30363d" stroke-width="2"/>
  <line x1="120" y1="106" x2="600" y2="106" stroke="#30363d" stroke-width="2"/>
  <line x1="120" y1="106" x2="120" y2="128" stroke="#30363d" stroke-width="2"/>
  <line x1="280" y1="106" x2="280" y2="128" stroke="#30363d" stroke-width="2"/>
  <line x1="440" y1="106" x2="440" y2="128" stroke="#30363d" stroke-width="2"/>
  <line x1="600" y1="106" x2="600" y2="128" stroke="#30363d" stroke-width="2"/>

  <!-- === PROJECT BOXES === -->

  <!-- ModelAtlas (blue) -->
  <g filter="url(#glow-blue)">
    <rect x="55" y="128" width="130" height="55" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="120" y="149" text-anchor="middle" dominant-baseline="middle" dy="0.05em" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">ModelAtlas</text>
    <text x="120" y="170" text-anchor="middle" dominant-baseline="middle" fill="#8b949e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">29,657 models</text>
  </g>

  <!-- Wayfinder (orange) -->
  <g filter="url(#glow-orange)">
    <rect x="215" y="128" width="130" height="55" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <text x="280" y="149" text-anchor="middle" dominant-baseline="middle" dy="0.05em" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Wayfinder</text>
    <text x="280" y="170" text-anchor="middle" dominant-baseline="middle" fill="#8b949e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">63% Mathlib</text>
  </g>

  <!-- LintGate (green) -->
  <g filter="url(#glow-green)">
    <rect x="375" y="128" width="130" height="55" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="440" y="149" text-anchor="middle" dominant-baseline="middle" dy="0.05em" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">LintGate</text>
    <text x="440" y="170" text-anchor="middle" dominant-baseline="middle" fill="#8b949e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">MC/DC capable</text>
  </g>

  <!-- Wesker (purple) -->
  <g filter="url(#glow-purple)">
    <rect x="535" y="128" width="130" height="55" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="600" y="149" text-anchor="middle" dominant-baseline="middle" dy="0.05em" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Wesker</text>
    <text x="600" y="170" text-anchor="middle" dominant-baseline="middle" fill="#8b949e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">100-500x faster</text>
  </g>

  <!-- === DOMAIN LABELS === -->
  <text x="120" y="202" text-anchor="middle" fill="#484f58" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.05em">ML MODELS</text>
  <text x="280" y="202" text-anchor="middle" fill="#484f58" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.05em">PROOFS</text>
  <text x="440" y="202" text-anchor="middle" fill="#484f58" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.05em">CODE</text>
  <text x="600" y="202" text-anchor="middle" fill="#484f58" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.05em">MUTATIONS</text>

</svg>
